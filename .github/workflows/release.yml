name: Release

# A tag cuts a release: git flow release finish tags main, and the version comes from
# the tag, as the cli's does. The notes give the script tag with its integrity hash.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag must be on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not an ancestor of main"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Version from the tag
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"

      # prepack runs the typecheck, the tests and the build. npm signs in as this
      # workflow, its trusted publisher, with no token.
      - name: Publish
        run: npm publish

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          sri="sha384-$(openssl dgst -sha384 -binary dist/meandr-chat.js | openssl base64 -A)"
          src="https://cdn.jsdelivr.net/npm/@meandr/chat-sdk@$version/dist/meandr-chat.js"
          printf '%s\n' "npm install @meandr/chat-sdk@$version" "" \
            "The script file, for pages without a bundler:" "" '```html' \
            "<script src=\"$src\"" "        integrity=\"$sri\" crossorigin=\"anonymous\"></script>" '```' > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
