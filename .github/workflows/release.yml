name: Release

# A vX.Y.Z tag on main publishes that version to npm with provenance, and a GitHub
# release whose notes give the script file's tag with its integrity hash.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: The tag is on main and is package.json's version
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main; push main first, then the tag."; exit 1; }
          test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME" || {
            echo "::error::package.json's version is not ${GITHUB_REF_NAME#v}."; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # prepack runs the typecheck, the tests and the build. NPM_TOKEN serves the first
      # release only: once npm trusts this workflow, the secret goes and OIDC signs in.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          sri="sha384-$(openssl dgst -sha384 -binary dist/meandr-chat.js | openssl base64 -A)"
          src="https://cdn.jsdelivr.net/npm/@meandr/chat-sdk@$version/dist/meandr-chat.js"
          printf '%s\n' "npm install @meandr/chat-sdk@$version" "" \
            "The script file, for pages without a bundler:" "" '```html' \
            "<script src=\"$src\"" "        integrity=\"$sri\" crossorigin=\"anonymous\"></script>" '```' > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
