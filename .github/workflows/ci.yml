name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true

      - run: npm ci
      - run: npm run check

      # The package must pack before a tag exists, or the failure lands at the release.
      - run: npm pack --dry-run --ignore-scripts
